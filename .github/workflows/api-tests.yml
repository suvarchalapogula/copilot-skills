name: API Tests

# Runs the orders API suite against a live environment.
#   - on every push/PR that touches the tests  -> read-only tiers against staging
#   - nightly                                   -> full suite including destructive tests
#   - manually (Actions tab -> Run workflow)    -> you choose environment and tier
on:
  push:
    branches: [main]
    paths:
      - "api_tests/**"
      - ".github/workflows/api-tests.yml"
  pull_request:
    paths:
      - "api_tests/**"
      - ".github/workflows/api-tests.yml"
  schedule:
    - cron: "30 1 * * *" # 01:30 UTC nightly = 07:00 IST
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to test against"
        type: choice
        options: [staging, production]
        default: staging
      tier:
        description: "Which tests to run"
        type: choice
        options: [read-only, happy_path, schema, e2e, all-including-destructive]
        default: read-only

concurrency:
  # Never let two runs hit the same environment at once - destructive tests
  # create and delete real data and would trip over each other.
  group: api-tests-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  test:
    name: ${{ github.event.inputs.tier || 'read-only' }} @ ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Environment-scoped secrets. Set 'production' to require manual approval
    # under Settings -> Environments so destructive runs cannot fire unattended.
    environment: ${{ github.event.inputs.environment || 'staging' }}

    permissions:
      contents: read

    steps:
      - name: Check out the tests
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api_tests/requirements.txt

      - name: Install dependencies
        working-directory: api_tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-md-report

      - name: Confirm the API is reachable
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::API_BASE_URL secret is not set for this environment."
            echo "Add it under Settings -> Environments -> ${{ github.event.inputs.environment || 'staging' }} -> Environment secrets."
            exit 1
          fi
          # Fail fast with a clear message rather than 14 confusing test failures.
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$API_BASE_URL" || echo "000")
          if [ "$code" = "000" ]; then
            echo "::error::Could not reach the API. Check the URL, and whether the host allows GitHub-hosted runners through its firewall."
            exit 1
          fi
          echo "Host responded with HTTP $code - proceeding."

      - name: Select test scope
        id: scope
        run: |
          case "${{ github.event.inputs.tier || 'read-only' }}" in
            read-only)                 echo 'marker=not destructive'            >> "$GITHUB_OUTPUT" ;;
            happy_path)                echo 'marker=happy_path and not destructive' >> "$GITHUB_OUTPUT" ;;
            schema)                    echo 'marker=schema and not destructive' >> "$GITHUB_OUTPUT" ;;
            e2e)                       echo 'marker=e2e and not destructive'    >> "$GITHUB_OUTPUT" ;;
            all-including-destructive) echo 'marker='                           >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run the suite
        working-directory: api_tests
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          ORDERS_PATH: ${{ vars.ORDERS_PATH || '/orders' }}
          MAX_LATENCY_MS: ${{ vars.MAX_LATENCY_MS || '2000' }}
          REQUEST_TIMEOUT: "15"
        run: |
          MARKER="${{ steps.scope.outputs.marker }}"
          if [ -n "$MARKER" ]; then
            python -m pytest . -v -m "$MARKER" --junitxml=results.xml --md-report --md-report-output=report.md
          else
            python -m pytest . -v --junitxml=results.xml --md-report --md-report-output=report.md
          fi

      - name: Publish results to the run summary
        if: always()
        working-directory: api_tests
        run: |
          {
            echo "## API Test Results"
            echo ""
            echo "**Environment:** ${{ github.event.inputs.environment || 'staging' }}"
            echo "**Scope:** ${{ github.event.inputs.tier || 'read-only' }}"
            echo ""
            cat report.md 2>/dev/null || echo "_No report produced - the run failed before tests started._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the full report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: api-test-results-${{ github.run_number }}
          path: |
            api_tests/results.xml
            api_tests/report.md
          retention-days: 30
