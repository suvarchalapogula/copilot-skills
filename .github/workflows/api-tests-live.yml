name: API Tests (Live)

# Runs the suite against a REAL public API: https://api.restful-api.dev
#
# No secrets required - the service needs no authentication. This is the run
# that proves the pipeline works end to end against a genuine internet-facing
# service rather than a mock.
#
# NOTE: that API is a shared public sandbox. The destructive tests create and
# delete objects there, which is expected and allowed, but never point this
# workflow at anything of your own without reading the tests first.
on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Which tests to run"
        type: choice
        options: [read-only, all-including-destructive]
        default: all-including-destructive
  schedule:
    - cron: "0 2 * * 1" # Mondays 02:00 UTC - a weekly contract-drift check

concurrency:
  group: api-tests-live
  cancel-in-progress: false

jobs:
  live:
    name: Live API suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    env:
      API_BASE_URL: https://api.restful-api.dev
      OBJECTS_PATH: /objects
      REQUEST_TIMEOUT: "20"
      MAX_LATENCY_MS: "5000"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api_tests_live/requirements.txt

      - name: Install dependencies
        working-directory: api_tests_live
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-md-report

      - name: Confirm the API is reachable
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$API_BASE_URL/objects" || echo "000")
          if [ "$code" != "200" ]; then
            echo "::warning::The public API returned HTTP $code. It may be rate limiting or temporarily down."
          fi
          echo "Reachability check: HTTP $code"

      - name: Select test scope
        id: scope
        run: |
          if [ "${{ github.event.inputs.tier || 'all-including-destructive' }}" = "read-only" ]; then
            echo 'marker=not destructive' >> "$GITHUB_OUTPUT"
          else
            echo 'marker=' >> "$GITHUB_OUTPUT"
          fi

      - name: Run the suite
        working-directory: api_tests_live
        run: |
          MARKER="${{ steps.scope.outputs.marker }}"
          if [ -n "$MARKER" ]; then
            python -m pytest . -v -m "$MARKER" --junitxml=results.xml --md-report --md-report-output=report.md
          else
            python -m pytest . -v --junitxml=results.xml --md-report --md-report-output=report.md
          fi

      - name: Publish results to the run summary
        if: always()
        working-directory: api_tests_live
        run: |
          {
            echo "## Live API Test Results"
            echo ""
            echo "**Target:** https://api.restful-api.dev/objects (public, no auth)"
            echo "**Scope:** ${{ github.event.inputs.tier || 'all-including-destructive' }}"
            echo ""
            cat report.md 2>/dev/null || echo "_No report produced._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the full report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: live-test-results-${{ github.run_number }}
          path: |
            api_tests_live/results.xml
            api_tests_live/report.md
          retention-days: 14
