name: API Tests (Demo)

# Runs the FULL suite - all 14 tests, including the destructive lifecycle ones -
# against a mock orders API started inside the runner.
#
# No secrets, no external service, nothing to configure. Everything is created
# and destroyed inside the job, so there is no real data to damage.
#
# Use this to prove the suite works. Use api-tests.yml for a real API.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "api_tests/**"
      - ".github/workflows/api-tests-demo.yml"

jobs:
  demo:
    name: Full suite against the mock API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    env:
      API_BASE_URL: http://127.0.0.1:8000
      API_TOKEN: test-token
      ORDERS_PATH: /orders
      MAX_LATENCY_MS: "2000"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api_tests/requirements.txt

      - name: Install dependencies
        working-directory: api_tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-md-report

      - name: Start the mock orders API
        working-directory: api_tests
        run: |
          nohup python mock_server.py 8000 > mock.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -sf -H "Authorization: Bearer test-token" http://127.0.0.1:8000/orders > /dev/null; then
              echo "Mock API is up after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::Mock API did not start in time."
          cat mock.log
          exit 1

      - name: Run the full suite
        working-directory: api_tests
        run: python -m pytest . -v --junitxml=results.xml --md-report --md-report-output=report.md

      - name: Publish results to the run summary
        if: always()
        working-directory: api_tests
        run: |
          {
            echo "## API Test Results — mock API (all 14 tests)"
            echo ""
            cat report.md 2>/dev/null || echo "_No report produced._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the full report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: demo-test-results-${{ github.run_number }}
          path: |
            api_tests/results.xml
            api_tests/report.md
          retention-days: 14
